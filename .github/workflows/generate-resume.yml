name: Generate Resume PDFs

on:
  push:
    branches: [main]
    paths:
      - 'src/content/resume*.md'

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Start server
        run: HOST=0.0.0.0 node dist/server/entry.mjs &

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 30000

      - name: Generate PDFs
        run: npm run resume

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume*.pdf
          git diff --staged --quiet || git commit -m "chore: regenerate resume PDFs [skip ci]"
          git push
